services:
  # ── API server ──────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ── ARQ background worker ──────────────────────────────────────────
  worker:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    command: ["arq", "app.infrastructure.jobs.arq_worker.WorkerSettings"]

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── MinIO (S3-compatible object storage) ───────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ── Postgres (local test only) ─────────────────────────────────────
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hrmf_test
      POSTGRES_PASSWORD: hrmf_test
      POSTGRES_DB: hrmf_test
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  redis_data:
  minio_data:
