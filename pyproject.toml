[project]
name = "hrmf-backend"
version = "0.1.0"
description = "Human Resource Management Framework – backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "email-validator>=2.1",
    "structlog>=24.1",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis>=4.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "api.index:app"

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "T20",       # flake8-print
    "RUF",       # ruff-specific
]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "arq.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.infrastructure.*",
    "app.core.database",
    "app.presentation.*",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "app.domain.employees.entities",
    "app.application.*",
    "app.core.dependencies",
]
disallow_any_generics = false

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One loop for the whole session so module-level async SQLAlchemy engines
# (used by API tests) are not bound to a closed loop between tests on CI.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
]
